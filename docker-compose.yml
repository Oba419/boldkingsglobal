services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: bkg
      POSTGRES_PASSWORD: bkg_dev_password
      POSTGRES_DB: boldkings
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkg -d boldkings"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
